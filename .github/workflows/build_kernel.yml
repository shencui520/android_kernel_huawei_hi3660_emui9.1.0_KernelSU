name: Build Huawei-hi3660-KSU-EMUI9.1.0-Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: 'true'
        fetch-depth: 1

    - name: Cache Linaro toolchain
      id: toolchain-cache
      uses: actions/cache@v4
      with:
        path: ToolChains
        key: hi3660-linaro-gcc-4.9-v1

    - name: Cache Python 2.7
      id: python2-cache
      uses: actions/cache@v4
      with:
        path: .cache/python2.7
        key: hi3660-python-2.7.18-ubuntu-22.04-v1

    - name: Set up kernel ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: hi3660-gcc49
        restore-keys: |
          hi3660-gcc49
        max-size: 2G
        verbose: 1

    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt install binutils make libssl-dev flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev adb fastboot -y
        if [ ! -x ToolChains/bin/aarch64-linux-gnu-gcc ]; then
          git clone https://github.com/Coconutat/ToolChains.git --depth=1 -b linaro_gcc_4.9
        else
          echo "Using cached Linaro GCC 4.9 toolchain."
        fi
        make mrproper

    - name: Install or restore legacy Python 2.7
      run: |
        python2_prefix="$GITHUB_WORKSPACE/.cache/python2.7"
        if [ ! -x "$python2_prefix/bin/python2.7" ]; then
          curl -fsSLO https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix="$python2_prefix" --without-ensurepip
          make -j"$(nproc)"
          make install
          cd ..
        else
          echo "Using cached Python 2.7."
        fi
        ln -sf python2.7 "$python2_prefix/bin/python"
        ln -sf python2.7 "$python2_prefix/bin/python2"
        echo "$python2_prefix/bin" >> "$GITHUB_PATH"
        export PATH="$python2_prefix/bin:$PATH"
        python --version
    
    - name: GetTime
      id: get_time
      run: |
        echo "TIME=$(TZ=UTC-8 date +%m%d%H%M )" >> $GITHUB_OUTPUT

    # - name: Build Kernel
    #   run: |
    #    if [ -d include/config ];
    #     then
    #      echo "Find config,will remove it"
    #      rm -rf include/config
    #    else
    #     echo "No Config,good."
    #    fi

    #    rm -rf KernelSU
    #    rm -rf drivers/kernelsu
    #    curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2
    #    export PATH=$(pwd)/ToolChains/bin/:$PATH
    #    export ARCH=arm64
    #    export SUBARCH=arm64
    #    make $KERNEL_CMDLINE Pangu_P10_KSU_defconfig
    #    make $KERNEL_CMDLINE -j$(nproc --all)
    #    tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c00000 --header_version 1 --os_version 9 --os_patch_level 2020-09-05  --output Pangu_P10_KSU-EMUI9.1.0-enforcing-${{ steps.get_time.outputs.TIME }}.img
    #    tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c00000 --header_version 1 --os_version 9 --os_patch_level 2020-09-05  --output Pangu_P10_KSU-EMUI9.1.0-permissive-${{ steps.get_time.outputs.TIME }}.img

    # - name: Upload P10-KSU-Kernel
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: Pangu_P10_KSU-EMUI9.1.0-kernel-${{ steps.get_time.outputs.TIME }}
    #     path: "Pangu_P10_KSU-*.img"

    - name: Build V9-KSU-Kernel
      run: |
        if [ -d include/config ];
         then
          echo "Find config,will remove it"
          rm -rf include/config
        else
          echo "No Config,good."
        fi

        rm -rf KernelSU
        rm -rf drivers/kernelsu
        rm -rf out
        rm -rf Pangu_P10_KSU-*.img
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.2
        export PATH=$(pwd)/ToolChains/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make $KERNEL_CMDLINE Pangu_KSU_defconfig
        for option in SYSVIPC POSIX_MQUEUE FHANDLE NAMESPACES UTS_NS IPC_NS PID_NS NET_NS SECCOMP CGROUP_DEVICE CGROUP_FREEZER CPUSETS CGROUP_CPUACCT BLK_CGROUP CGROUP_SCHED FAIR_GROUP_SCHED HW_CGROUP_PIDS CGROUP_CPUSET_PREFIX_COMPAT MEMCG MEMCG_SWAP MEMCG_SWAP_ENABLED CFS_BANDWIDTH BLK_DEV_LOOP EXT4_FS EXT4_FS_POSIX_ACL EXT4_FS_SECURITY OVERLAY_FS PM_AUTOSLEEP PM_WAKELOCKS F2FS_FS_XATTR F2FS_FS_POSIX_ACL F2FS_FS_SECURITY VETH NET_L3_MASTER_DEV MACVLAN IPVLAN NETFILTER_XT_MATCH_ADDRTYPE; do
          grep -q "^CONFIG_${option}=y$" out/.config || { echo "Missing CONFIG_${option}=y"; exit 1; }
        done
        # Huawei's HW_CGROUP_PIDS provides the pids controller used by Android
        # and Docker. Enabling the duplicate upstream controller would register
        # the same cgroup subsystem twice.
        grep -q '^# CONFIG_CGROUP_PIDS is not set$' out/.config || { echo "CGROUP_PIDS must stay disabled in favor of HW_CGROUP_PIDS"; exit 1; }
        grep -q '^# CONFIG_USER_NS is not set$' out/.config || { echo "USER_NS must stay disabled on this Android 9 kernel"; exit 1; }
        grep -q '^CONFIG_BRIDGE=y$' out/.config || { echo "Expected CONFIG_BRIDGE=y"; exit 1; }
        grep -q '^# CONFIG_BRIDGE_NETFILTER is not set$' out/.config || { echo "BRIDGE_NETFILTER must stay disabled"; exit 1; }
        ! grep -q '^CONFIG_DOCKER_STAY_AWAKE=y$' out/.config || { echo "Permanent Docker wake lock must stay disabled"; exit 1; }
        make $KERNEL_CMDLINE CC="ccache aarch64-linux-gnu-gcc" HOSTCC="ccache gcc" -j$(nproc --all)
        tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c00000 --header_version 1 --os_version 9 --os_patch_level 2020-09-05  --output Pangu_V9_KSU-LinuxServer-enforcing-${{ steps.get_time.outputs.TIME }}.img
        tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c00000 --header_version 1 --os_version 9 --os_patch_level 2020-09-05  --output Pangu_V9_KSU-LinuxServer-permissive-${{ steps.get_time.outputs.TIME }}.img

    - name: Upload V9-KSU-Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Pangu_V9_KSU-LinuxServer-kernel-${{ steps.get_time.outputs.TIME }}
        path: "Pangu_V9_KSU-LinuxServer-*.img"
